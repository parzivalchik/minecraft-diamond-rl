plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = 'dev.mcrl'
base { archivesName = 'mcrl' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

test {
    useJUnitPlatform()
}

loom {
    runs {
        client {
            // Small window = cheap rendering; frames are downsampled to 64x64 anyway.
            programArgs '--width', '320', '--height', '240'
            // Forward e.g. `./gradlew runClient -Pmcrl.tickRate=200` to the game JVM.
            // `-Pmcrl.autoWorld=true` creates/opens the rl_arena world at the title screen (AutoWorld).
            ['mcrl.port', 'mcrl.tickRate', 'mcrl.autoWorld'].each { key ->
                if (project.hasProperty(key)) vmArg "-D${key}=${project.property(key)}"
            }
        }
    }
}
